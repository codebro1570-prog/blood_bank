version: '3.8'

services:
  # ----------------------------------------------------
  # 1. Database (MySQL 8.0)
  # ----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: bloodbank_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bloodbank
      MYSQL_USER: bloodbank
      MYSQL_PASSWORD: bloodbank
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bloodbank", "-pbloodbank"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloodbank_net

  # ----------------------------------------------------
  # 2. Apache Zookeeper (Distributed Coordinator for Kafka)
  # ----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bloodbank_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bloodbank_net

  # ----------------------------------------------------
  # 3. Apache Kafka (Distributed Event Streaming Platform)
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bloodbank_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloodbank_net

  # ----------------------------------------------------
  # 4. Redis (In-Memory Distributed Cache & Idempotency Store)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bloodbank_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloodbank_net

  # ----------------------------------------------------
  # 5. Backend Cluster Instance 1 (Active Replica)
  # ----------------------------------------------------
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodbank_backend_1
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/bloodbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: bloodbank
      DB_PASSWORD: bloodbank
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: bloodbank-domain-events
      KAFKA_GROUP_ID: bloodbank-cluster-backend
    networks:
      - bloodbank_net

  # ----------------------------------------------------
  # 6. Backend Cluster Instance 2 (Active Replica for High Availability)
  # ----------------------------------------------------
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodbank_backend_2
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/bloodbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: bloodbank
      DB_PASSWORD: bloodbank
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: bloodbank-domain-events
      KAFKA_GROUP_ID: bloodbank-cluster-backend
    networks:
      - bloodbank_net

  # ----------------------------------------------------
  # 7. Nginx Load Balancer & High-Performance Gateway
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: bloodbank_nginx_lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - bloodbank_net

networks:
  bloodbank_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
