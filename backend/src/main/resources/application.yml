server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  application:
    name: blood-bank
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:bloodbank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:bloodbank}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:bloodbank}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:${REDISHOST:localhost}}
      port: ${REDIS_PORT:${REDISPORT:6379}}
      password: ${REDIS_PASSWORD:${REDISPASSWORD:}}
      timeout: 2000ms
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
bloodbank:
  shelfLifeDays: 42
  donationGapDays: 90
  minAge: 18
  maxAge: 65
  minWeightKg: 50
  minVolumeMl: 300
  maxVolumeMl: 500
  maxUnitsPerRequest: 10
  lowStockThreshold: 10
  nearExpiryDays: 7
  nearExpiryAlertDays: 3
  duplicateWindowMinutes: 10
  jwt:
    secret: ${JWT_SECRET:c3VwZXJzZWNyZXRqd3RrZXlmaXJzdGltZTEyMzQ1Njc4OTAxMjM0NTY=}
    expirySeconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  redis:
    enabled: ${REDIS_ENABLED:true}
    idempotency-ttl-hours: 24
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${KAFKA_TOPIC:bloodbank-domain-events}
    group-id: ${KAFKA_GROUP_ID:bloodbank-consumer-group}