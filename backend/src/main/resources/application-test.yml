spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///bloodbank?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    show-sql: false
  flyway:
    enabled: true
  cache:
    type: simple
app:
  redis:
    enabled: false
logging:
  level:
    root: WARN
    com.bloodbank: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
bloodbank:
  jwt:
    secret: test-only-secret-key-for-unit-tests-32-bytes-minimum
    expirySeconds: 3600