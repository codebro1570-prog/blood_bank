user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: $upstream_addr rt=$request_time uct=$upstream_connect_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting Zone to prevent DDoS / brute-force crashes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Backend Load Balancer Cluster (Active-Active Replicas)
    upstream backend_cluster {
        least_conn; # Routes requests to instance with least active connections
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream Frontend Portals
    upstream admin_portal {
        server admin-portal:5173;
    }

    upstream donor_portal {
        server donor-portal:5174;
    }

    upstream hospital_portal {
        server hospital-portal:5175;
    }

    upstream staff_portal {
        server staff-portal:5176;
    }

    # Gateway Server (Port 80)
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25M;
        client_body_buffer_size 128k;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Load Balancer Health Check
        location /health {
            access_log off;
            return 200 '{"status":"UP","load_balancer":"nginx","clustering":"active"}';
            add_header Content-Type application/json;
        }

        # Actuator Probes forwarded to backend cluster
        location /actuator/health {
            proxy_pass http://backend_cluster/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Reverse Proxy & Load Balancing with Failover
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Robust timeout & failover settings to prevent single-backend crashes
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Swagger Docs Proxy
        location /swagger-ui {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
        }

        # Frontend Portal Proxies
        location /admin {
            proxy_pass http://admin_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /donor {
            proxy_pass http://donor_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /hospital {
            proxy_pass http://hospital_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /staff {
            proxy_pass http://staff_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Default Landing Routing
        location / {
            proxy_pass http://donor_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
